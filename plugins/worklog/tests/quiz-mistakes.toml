# Real-world mistakes — edge cases, traps, and common misunderstandings.
[generation]
model = "gpt-5.4"
temperature = 0.0

[[prompts]]
role = "system"
prompt = "You are a software engineer learning a new project management system. Answer questions about it based solely on the reference document provided. Be concise and specific."

[[prompts]]
role = "user"
file = "../skills/worklog/SKILL.md"
separator = "\n---\n"

[[prompts]]
role = "user"
prompt = [
  "A spec is no longer relevant to the project. How do you clean it up?",
  "Plan p0004 contains a detailed inline specification of the caching layer — invalidation rules, TTL defaults, eviction policy. All implementing tasks are done. You're about to archive p0004. Walk through what you'd check before archiving.",
  "After deploying, you notice the code handles timeouts differently from what spec s0003 describes. The code works correctly in production and passes all tests. What do you do?",
  "Plan p0003 has targets = ['s0002']. During implementation, task t0010 also needs to create a brand new spec s0005. List every frontmatter change needed across all affected items.",
  "Plan p0006 is trivial — adding one config field. You want to skip creating tasks and just make the change directly. Walk through how you'd handle p0006's lifecycle.",
  "You archived plan p0001 (status='abandoned'). Tasks t0005 and t0008 both have blocked_by = ['p0001']. What is the state of t0005 and t0008 now?",
  "Task t0015 modifies spec s0003. You need to write the updated content for s0003. Plan p0004 describes the intended design. The code in src/auth.py is already complete and tested. How do you write s0003?",
  "Plan p0003 (status='active', targets = ['s0005', 's0006']) has two implementing tasks: t0010 (done, modifies = ['s0005']) and t0011 (done, modifies = ['s0006']). validate.py reports no errors. You're ready to archive. Walk through the steps.",
  "Plan p0007 (status='active', targets = ['s0008']) has one task: t0020 (implements = ['p0007']). t0020 has written the code in src/payments.py, all tests pass, and t0020 is marked done. You want to archive everything. What do you do?",
]

[output]
file = "quiz-mistakes-results.toml"
